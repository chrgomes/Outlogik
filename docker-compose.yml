# Local development services. The API and Angular app run directly in WSL2 for fast reloads.
#   docker compose up -d
name: outlogik

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: outlogik
      POSTGRES_PASSWORD: outlogik
      POSTGRES_DB: outlogik
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outlogik -d outlogik"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development-only email inbox: http://localhost:8025 (SMTP on 1025).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  redis-data:
