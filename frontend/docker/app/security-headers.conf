# Included by every location in nginx.conf (nginx drops inherited add_header lines when a
# location sets its own, so each location includes this whole set).
include /etc/nginx/snippets/csp.conf;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
# The client portal is private: keep every page out of search results.
add_header X-Robots-Tag "noindex, nofollow" always;
