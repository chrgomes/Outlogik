# Serves the Outlogik app (single-page app) on port 8080, behind DigitalOcean App Platform,
# which terminates HTTPS and routes /api to the API.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Build files have content hashes in their names: cache them for a year.
    location ~* \.(?:js|css|woff2?|svg|png|ico|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is the app itself. index.html is never cached, so new releases load.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
